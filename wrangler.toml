# Change the name here to the name of your own workers
name = "chatbot"
workers_dev = true
compatibility_date = "2024-11-11"
compatibility_flags = ["nodejs_compat_v2"]

# Deploy dist
main = "packages/apps/workers-mk2/dist/index.js"

# -----------------------------------------------------------------------------
# 🧠 הגדרת מרחב ה-Durable Object הייעודי לבוט (חדש ומבודד)
# -----------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatbotSessionDO"

[[migrations]]
tag = "v1"
new_classes = ["ChatbotSessionDO"]

# -----------------------------------------------------------------------------
# 🤖 משתנים וחיבורים קיימים שנשמרו במלואם
# -----------------------------------------------------------------------------
[vars]
# TELEGRAM_AVAILABLE_TOKENS = 'token1,token2'
# CHAT_WHITE_LIST = 'chat_id1,chat_id2'

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "DATABASE"
id = "8f517f7c1c554db1b268d976683530d3"

[[services]]
binding = "TTS_SERVICE"
service = "ttss"

[[services]]
binding = "STT_SERVICE"
service = "sstt"

[[services]]
binding = "NEWS_SERVICE"
service = "news"

[[services]]
binding = "ZMAN_SERVICE"
service = "zman"

[[services]]
binding = "LNEWS_SERVICE"
service = "lnews"

[[services]]
binding = "MOVI_SERVICE"
service = "movi"
